<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XD</title>
    <link rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .banner {
            background-color: #0d121b;
            padding: 20px;
            width: 100%;
            text-align: center;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-color: #ccd3dd;
        }

        h1 {
            font-size: 26px;
            color: #333;
        }

        p {
            font-size: 16px;
            color: #333;
        }

        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg">
    <div class="banner">
        <h1><span style="font-size: 24px; color: #dfdfdf;">Aula 1</span></h1>
    </div>
    <h1>Olá, mundo!</h1>
    <p><b>Isto</b> <i>é</i> <u>um</u> <s>parágrafo</s>.</p>
    <img src="mahoraga.png" alt="Mahoraga advogado fds">
</body>
</html>
