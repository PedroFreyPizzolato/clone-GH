<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Programação Web</title>
    </head>
    <body>
        <h1>Formulário</h1>
        <form method="post" action="process.php">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome_aluno" required minlength="2" maxlength="20" placeholder="Digite seu nome">

            <br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="data_nascimento" placeholder="Digite sua data de nascimento">

            <br>

            <label for="carro">Carro:</label>
            <select id="carro" name="carro">
                <option>- Selecione um carro -</option>
                <option value="volvo">Volvo</option>
                <option value="volkswagen">Volkswagen</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
            </select>

            <br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </body>
</html>
